name: suyoapp_com
# Our images are tagged by CI with both :latest and the git commit sha.
# IMAGE_TAG=<sha> docker compose up -d   -> run that exact build (deploys do this)
# docker compose up -d                   -> :latest
services:
  suyoapp_com_api:
    image: rg2.vintolab.com/suyoapp_com/api:${IMAGE_TAG:-latest}
    container_name: suyoapp_com_api
    restart: unless-stopped
    ports:
      - "10.50.0.2:9051:80"
    env_file:
      - .env/db.env
      - .env/s3bender.env
      - .env/session.env
      - .env/stripe.env
      - .env/smtp.env
      - .env/redis.env
      - .env/iap.env
      - .env/ratelimit.env

  suyoapp_com_admin:
    image: rg2.vintolab.com/suyoapp_com/admin:${IMAGE_TAG:-latest}
    container_name: suyoapp_com_admin
    restart: unless-stopped
    ports:
      - "10.50.0.2:9052:80"
    env_file:
      - .env/db.env
      - .env/smtp.env
      - .env/session.env
      - .env/s3bender.env
      - .env/redis.env

  suyoapp_com_webui:
    image: rg2.vintolab.com/suyoapp_com/webui:${IMAGE_TAG:-latest}
    container_name: suyoapp_com_webui
    restart: unless-stopped
    ports:
      - "10.50.0.2:9053:80"
