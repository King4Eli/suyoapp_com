name: suyoapp_com
services:
  suyoapp_com_api:
    build:
      context: ./api
      args:
        # local builds report "dev" in logs; CI bakes the commit sha
        BUILD_HASH: ${BUILD_HASH:-dev}
    volumes:
      - ./api:/app
    command: npm run http-dev
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NODE_ENV=development
    ports:
      - "9054:80"

  suyoapp_com_admin:
    build: ./admin
    volumes:
      - ./admin:/var/www/html

  suyoapp_com_webui:
    build:
      context: ./web
      target: build
    command: npm run dev -- --host 0.0.0.0

  suyoapp_com_llm:
    # reachable from the host for trying prompts: curl localhost:11434/api/tags
    ports:
      - "127.0.0.1:11434:11434"
