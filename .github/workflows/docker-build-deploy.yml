name: Build and Deploy Docker Images

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "admin/**"
      - "web/**"
      - "mobile/**"
      - ".github/workflows/docker-build-deploy.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: ./api
            registry_image: rg2.vintolab.com/suyoapp_com/api
            ghcr_image: ghcr.io/king4eli/suyoapp_com/api
          - service: admin
            context: ./admin
            registry_image: rg2.vintolab.com/suyoapp_com/admin
            ghcr_image: ghcr.io/king4eli/suyoapp_com/admin
          - service: web
            context: ./web
            registry_image: rg2.vintolab.com/suyoapp_com/webui
            ghcr_image: ghcr.io/king4eli/suyoapp_com/webui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.registry_image }}:latest
            ${{ matrix.registry_image }}:${{ github.sha }}
            ${{ matrix.ghcr_image }}:latest
            ${{ matrix.ghcr_image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  mobile-build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Build release APK
        run: npm run build:apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suyoapp-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Pull images and run containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            # Migrate and seed before the new api starts.
            # A failure aborts here and leaves the old containers running.
            docker compose -f docker-compose.yml run --rm --no-deps suyoapp_com_api sh -c \
              "node node_modules/drizzle-kit/bin.cjs migrate --config=drizzle.config.js && node db/seed/index.js"
            
            docker compose -f docker-compose.yml up -d --remove-orphans --force-recreate
            docker compose -f docker-compose.yml ps
            docker image prune -f
