name: Build and Deploy Docker Images

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "admin/**"
      - "web/**"
      - "mobile/**"
      - ".github/workflows/docker-build-deploy.yml"
  # Checks only -- build/deploy jobs skip pull requests (see their `if`).
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "mobile/**"
      - ".github/workflows/docker-build-deploy.yml"
  workflow_dispatch:

jobs:
  # Formatting, lint and type checks. Everything below waits for these, so a
  # failing check never builds or deploys.
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # api is plain JS run by Node -- no type check, just format + lint.
          - project: api
            typecheck: ""
          - project: mobile
            typecheck: npx tsc --noEmit -p .
          - project: web
            # solution-style tsconfig -- build mode checks the referenced projects
            typecheck: npx tsc -b
    name: checks (${{ matrix.project }})
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npx prettier --check .

      - name: ESLint
        run: npx eslint . --max-warnings=0

      - name: TypeScript
        if: matrix.typecheck != ''
        run: ${{ matrix.typecheck }}

  # API end-to-end tests (api/test/): the real app against a throwaway MySQL +
  # Redis started with Docker Compose, built from the migrations and seed data.
  # No secrets needed -- test/test.env has fake credentials only and outbound
  # network is blocked inside the tests. Runs on pull requests too.
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # the test runner needs a newer Node than the checks job (globs, --test-force-exit)
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start test database and Redis, migrate, seed
        run: npm run test:db:up

      - name: Run API tests
        run: npm test

      - name: Database logs (on failure)
        if: failure()
        run: docker compose -f test/docker-compose.yml logs --tail=200

      - name: Stop test containers
        if: always()
        run: npm run test:db:down

  build-and-push:
    needs: [checks, api-tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: ./api
            registry_image: rg2.vintolab.com/suyoapp_com/api
            ghcr_image: ghcr.io/king4eli/suyoapp_com/api
          - service: admin
            context: ./admin
            registry_image: rg2.vintolab.com/suyoapp_com/admin
            ghcr_image: ghcr.io/king4eli/suyoapp_com/admin
          - service: web
            context: ./web
            registry_image: rg2.vintolab.com/suyoapp_com/webui
            ghcr_image: ghcr.io/king4eli/suyoapp_com/webui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # api reads it as BUILD_HASH and stamps it on every log row
          build-args: |
            BUILD_HASH=${{ github.sha }}
          tags: |
            ${{ matrix.registry_image }}:latest
            ${{ matrix.registry_image }}:${{ github.sha }}
            ${{ matrix.ghcr_image }}:latest
            ${{ matrix.ghcr_image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  mobile-build-apk:
    needs: [checks, api-tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Build release APK
        run: npm run build:apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suyoapp-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Pull images and run containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            # Run exactly the images this workflow just built, not whatever
            # :latest happens to point at by the time the pull runs.
            export IMAGE_TAG=${{ github.sha }}
            # Migrate and seed before the new api starts.
            # A failure aborts here and leaves the old containers running.
            docker compose -f docker-compose.yml run --rm --no-deps suyoapp_com_api sh -c \
              "node node_modules/drizzle-kit/bin.cjs migrate --config=drizzle.config.js && node db/seed/index.js"
            
            docker compose -f docker-compose.yml up -d --remove-orphans --force-recreate
            docker compose -f docker-compose.yml ps
            docker image prune -f
