# docker compose -f docker-compose.yml up -d
name: suyoapp_com

services:
  suyoapp_com_blog_ghost:
    image: ghost:latest
    container_name: suyoapp_com_blog_ghost
    restart: unless-stopped
    expose:
      - "2368"
    environment:
      url: https://blog.suyoapp.com
      database__client: mysql
      database__connection__host: host.docker.internal
      database__connection__port: "3306"
      database__connection__user: ${GHOST_DB_USER:?set in .env}
      database__connection__password: ${GHOST_DB_PASSWORD:?set in .env}
      database__connection__database: ${GHOST_DB_NAME:?set in .env}
      mail__transport: SMTP
      mail__options__host: suyoapp_com_blog_mail
      mail__options__port: "1025"
      mail__options__secure: "false"
      mail__options__ignoreTLS: "true"
      security__staffDeviceVerification: "false"
    volumes:
      - ghost-data:/var/lib/ghost/content
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared-global-network
    depends_on:
      - suyoapp_com_blog_mail

  suyoapp_com_blog_mail:
    image: maildev/maildev:latest
    container_name: suyoapp_com_blog_mail
    restart: unless-stopped
    ports:
      - "1080:1080"
    networks:
      - shared-global-network

  suyoapp_com_blog_qdrant:
    image: qdrant/qdrant:latest
    container_name: suyoapp_com_blog_qdrant
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - qdrant-data:/qdrant/storage

  suyoapp_com_blog_redis:
    image: redis:7-alpine
    container_name: suyoapp_com_blog_redis
    restart: unless-stopped

volumes:
  ghost-data:
  qdrant-data:

networks:
  shared-global-network:
    external: true
